const PF_PAGE = "compare";
applyTheme(currentTheme);
useCleanURL("compare");
function renderCompareFromURL(){
  if (new URLSearchParams(location.search).get("party") === "1") renderParty();
  else renderCompare();
}
renderCompareFromURL();
// setCompareModeURL() (global.js) updates the URL when switching modes
// in place without a real navigation; this is what makes browser
// back/forward actually restore the matching view instead of just
// changing the address bar underneath a stale render.
window.addEventListener("popstate", renderCompareFromURL);
