<script>
const PF_PAGE = "result";
applyTheme(currentTheme);
useCleanURL("result");
(function boot(){
  // Anything that can't be turned into a result sends the person Home WITH
  // an explanation (shown as a toast there, see showPendingFlash() in
  // global.js) instead of a silent redirect -- and a throw while building
  // or rendering a result (malformed share code, corrupted session data)
  // takes this same path rather than leaving a blank page.
  function bounce(message){
    try{ if (message) sessionStorage.setItem("pf_flash", message); } catch(e){ /* storage blocked */ }
    location.href = "index.html";
  }
  function show(code, decoded, celebrate){
    lastResult = buildResultFromDecoded(decoded, code);
    careersExpanded = false; funStatsOpen = false;
    renderResult();
    if (celebrate) fireConfetti();
  }
  let freshResult = null;
  try{ freshResult = sessionStorage.getItem("pf_fresh_result"); } catch(e){ /* storage blocked */ }
  if (freshResult){
    try{ sessionStorage.removeItem("pf_fresh_result"); } catch(e){}
    try{
      lastResult = JSON.parse(freshResult);
      careersExpanded = false; funStatsOpen = false;
      renderResult();
      fireConfetti();
      return;
    } catch(e){ /* fall through to the share-code paths below */ }
  }
  let viewSharedCode = null;
  try{ viewSharedCode = sessionStorage.getItem("pf_view_shared_code"); } catch(e){}
  if (viewSharedCode){
    try{ sessionStorage.removeItem("pf_view_shared_code"); } catch(e){}
    try{
      const decoded = decodeCode(viewSharedCode);
      if (decoded && decoded.obsolete) return bounce(OBSOLETE_CODE_MESSAGE);
      if (decoded){ show(viewSharedCode, decoded, false); return; }
    } catch(e){ return bounce("That result couldn't be opened. Try it again, or retake the assessment."); }
  }
  // A result page reloaded, bookmarked, or reopened from a copied address
  // bar URL carries no sessionStorage (that's a one-shot handoff from
  // index.html/the quiz) but DOES still carry setShareableURL()'s own
  // ?code= query param, so this is the difference between "reloading
  // your own result" working and silently bouncing to the landing page.
  const urlCode = getProfileCodeFromURL();
  if (urlCode){
    try{
      const decoded = decodeCode(urlCode);
      if (decoded && decoded.obsolete) return bounce(OBSOLETE_CODE_MESSAGE);
      if (decoded){ show(urlCode, decoded, false); return; }
    } catch(e){ /* falls through to the generic message below */ }
    return bounce("That link's result code couldn't be read. Check it for typos, or ask whoever sent it to share it again.");
  }
  bounce("There's no result to show yet. Take the assessment, or open a saved result from Home.");
})();
</script>
